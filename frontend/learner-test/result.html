<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Test Result | JHARNA</title>
    <link
        rel="stylesheet"
        href="test.css"
    >
</head>
<body>
<div class="start-page">
    <main class="start-container">
        <div class="start-card">
            <div
                id="resultIcon"
                class="test-icon"
            >
                🎉
            </div>
            <span
                id="resultStatus"
                class="practice-badge"
            >
                RESULT
            </span>
            <h1 id="resultTitle">
                Test Completed
            </h1>
            <p
                id="resultMessage"
                class="intro-text"
            >
            </p>
            <div class="test-info">
                <div class="info-box">
                    <span>🎯</span>
                    <div>
                        <strong>Score</strong>
                        <p id="score">
                            0 / 0
                        </p>
                    </div>
                </div>
                <div class="info-box">
                    <span>✅</span>
                    <div>
                        <strong>Correct</strong>
                        <p id="correct">
                            0
                        </p>
                    </div>
                </div>
                <div class="info-box">
                    <span>❌</span>
                    <div>
                        <strong>Incorrect</strong>
                        <p id="incorrect">
                            0
                        </p>
                    </div>
                </div>
            </div>
            <button
                id="reviewAnswersBtn"
                class="secondary-btn"
                style="width: 100%; margin-bottom: 15px;"
            >
                Review Answers
            </button>
            <button
                id="tryAgainBtn"
                class="start-test-btn"
            >
                Try Again →
            </button>
        </div>
    </main>
</div>
<script src="result.js"></script>
</body>
</html>
