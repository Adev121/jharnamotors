<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Admin Login | JHARNA</title>
    <link
        rel="stylesheet"
        href="admin.css"
    >
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="car-icon">
                    🚗
                </div>
                <h1>JHARNA</h1>
                <p>
                    Motor Training School
                </p>
            </div>
            <h2>
                Admin Login
            </h2>
            <p class="login-subtitle">
                Sign in to access the dashboard
            </p>
            <form id="loginForm">
                <div class="input-group">
                    <label>
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >
                </div>
                <div class="input-group">
                    <label>
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >
                </div>
                <p
                    id="errorMessage"
                    class="error-message"
                ></p>
                <button
                    type="submit"
                    id="loginButton"
                >
                    Login →
                </button>
            </form>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
